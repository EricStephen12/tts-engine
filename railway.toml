[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh /app/entrypoint.sh"
healthcheckPath = "/health/ready"
# Model load on first boot can exceed 60s on CPU; give the probe room
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
